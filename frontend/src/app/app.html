<header>
  <div class="left-info"></div>
  <div class="center-logo">
    <a routerLink="/" class="logo-link">
      <img src="assets/fritid_logo2.jpeg" alt="Fritid Shop Logo" class="logo">
    </a>
  </div>
  <nav>
    <a [routerLink]="['/']">Domov</a>
    <a [routerLink]="['/cart']">Košarica ({{ cartItemCount }})</a>

    <!-- Authentication section -->
    <ng-container *ngIf="user$ | async as user; else authButtons">
      <div class="user-section">
        <div class="admin-links" *ngIf="user.role === 'admin'">
          <a [routerLink]="['/admin/products']" class="admin-link">Izdelki</a>
          <a [routerLink]="['/admin/orders']" class="admin-link">Naročila</a>
        </div>
        <span class="user-greeting">Pozdravljeni, {{ user.name }}!</span>
        <button class="logout-btn" (click)="logout()">
          <span class="btn-icon">🚪</span>
          Odjava
        </button>
      </div>
    </ng-container>

    <ng-template #authButtons>
      <a [routerLink]="['/auth']" class="auth-link">
        <span class="btn-icon">👤</span>
        Prijava / Registracija
      </a>
    </ng-template>
  </nav>
</header>

<body>
  <div class="body-container">
    <router-outlet></router-outlet>
  </div>
</body>

<app-footer></app-footer>
<app-toast></app-toast>
